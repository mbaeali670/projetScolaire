<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact - Sunu Market</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- HEADER -->
<header>
  <div class="logo">Sunu Market 🛒</div>
  <nav>
    <ul>
      <li><a href="index.html">Accueil</a></li>
      <li><a href="index.html#boutique">Boutique</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>
  <div id="compteur-panier">Panier (0)</div>
</header>

<!-- FORMULAIRE CONTACT -->
<section class="contact-form">
  <h2>Contactez-nous</h2>
  <form id="contact-form">
    <input type="text" name="nom" placeholder="Nom" required>
    <input type="email" name="email" placeholder="Email" required>
    <textarea name="message" rows="5" placeholder="Message" required></textarea>
    <button type="submit">Envoyer</button>
  </form>
</section>

<!-- FOOTER -->
<footer>
  <p>Nom1 + Nom2</p>
  <p>Ce que nous avons compris : Créer un site vitrine responsive et interactif.</p>
  <p>Ce qui nous a été difficile : Gestion du panier et responsive design.</p>
</footer>

<!-- BOUTON RETOUR EN HAUT -->
<button id="btn-top">⬆</button>

<script src="script.js"></script>
</body>
</html>
